name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Test Windows mounted-folder I/O
        if: runner.os == 'Windows'
        run: cargo test windows_folder_mount_reads_io_counters -- --ignored

  # The release guard against a fake gh. Ignored in a plain `cargo test`
  # because it needs bash, git and jq.
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test the release guard
        run: cargo test --test release_guard -- --include-ignored

  # Advisories, licenses and sources for every dependency, per deny.toml. A
  # new RustSec advisory turns this red with no code change, which is the
  # point: the fix is an upgrade, or an ignore with a reason in deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The declared rust-version still builds. Without this, `rust-version` in
  # Cargo.toml is a guess: 1.75 stood there long after the code stopped
  # building on it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain from inputs
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo check on the minimum supported Rust
        run: cargo check --all-targets --locked

  # Real lvm2 output on real (loop-device) volume groups, so the parser is
  # checked against the lvm2 that ships, not just hand-written fixtures.
  # Runs as root: the reporting tools need it.
  lvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build the test binary
        run: cargo test --no-run

      - name: Build a VG with linear, RAID1, thin and snapshot LVs
        run: |
          set -ex
          sudo apt-get update -q
          sudo apt-get install -yq lvm2 thin-provisioning-tools
          sudo modprobe dm-raid dm-thin-pool dm-snapshot
          for i in 0 1 2; do
            truncate -s 256M "/tmp/pv$i.img"
            sudo losetup -f --show "/tmp/pv$i.img" | tee -a /tmp/loops
          done
          mapfile -t L < /tmp/loops
          sudo pvcreate "${L[@]}"
          sudo vgcreate dwtest "${L[@]}"
          sudo lvcreate -y -L 64M -n lin dwtest
          sudo lvcreate -y --type raid1 -m1 -L 32M -n mirr dwtest
          sudo lvcreate -y -L 96M -T dwtest/pool
          sudo lvcreate -y -V 128M -T dwtest/pool -n thinvol
          sudo dd if=/dev/urandom of=/dev/dwtest/thinvol bs=1M count=40 oflag=direct
          sudo lvcreate -y -s -L 16M -n snap dwtest/lin
          sudo dd if=/dev/urandom of=/dev/dwtest/lin bs=1M count=12 oflag=direct
          sudo lvs -a dwtest
          for t in vgs lvs pvs; do sudo $t --reportformat json --units b --nosuffix; done

      - name: Parse the real reports
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            cargo test real_lvm_reports_parse -- --ignored --nocapture
          sudo env "PATH=$PATH" "HOME=$HOME" cargo run -q -- --diag | sed -n '/=== LVM/,$p'
