name: Nix

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - package.nix
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - package.nix
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  # Builds package.nix the way a Nix user gets it: cargo test runs inside the
  # build sandbox, then versionCheckHook runs the installed binary. The
  # flake's checks include the package, so `nix flake check` does both.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Build and test
        run: nix flake check -L
