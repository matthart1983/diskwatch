name: Nix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Builds package.nix the way a Nix user gets it: cargo test runs inside the
  # build sandbox, then versionCheckHook runs the installed binary.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Check the flake
        run: nix flake check -L

      - name: Build
        run: nix build -L .#diskwatch
