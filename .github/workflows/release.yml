name: Release

on:
  push:
    tags: ['v*']

# Read-only by default. `release` is the only job that writes to this
# repository. The build jobs run third-party actions and compilers, and get no
# write scope.
permissions:
  contents: read

jobs:
  # Every other job needs this one, directly or through `build`. A tag push
  # starts this workflow alongside CI, and nothing used to wait for CI's result.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run list` reads CI's runs.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard asks whether the tag is on origin/main.
          fetch-depth: 0

      - name: Tag is the release, is on main, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-guard.sh "${GITHUB_REF_NAME}"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: diskwatch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: diskwatch-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: diskwatch-linux-x86_64-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: diskwatch-linux-aarch64-static
          - target: armv5te-unknown-linux-gnueabi
            os: ubuntu-latest
            name: diskwatch-linux-armv5te
          - target: x86_64-apple-darwin
            os: macos-latest
            name: diskwatch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: diskwatch-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: diskwatch-windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install aarch64 cross-compiler (Linux aarch64 glibc)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install armv5te cross-compiler (Iomega ix2-dl / Marvell Kirkwood, Debian armel)
        if: matrix.target == 'armv5te-unknown-linux-gnueabi'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi
          echo "CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_GNUEABI_LINKER=arm-linux-gnueabi-gcc" >> $GITHUB_ENV

      - name: Install zig + cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"linux-musl" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            suffix=".exe"
          fi
          cp "target/${{ matrix.target }}/release/diskwatch${suffix}" "${{ matrix.name }}${suffix}"
          tar czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}${suffix}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # Verify a download with `sha256sum --ignore-missing -c SHA256SUMS`.
      - name: Generate SHA256SUMS
        run: |
          sha256sum *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # The guard has already checked this section exists.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          # A tag with a hyphen is a pre-release, so /releases/latest and
          # Scoop's checkver don't pick it up.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.tar.gz
            SHA256SUMS

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Homebrew core has carried diskwatch since 0.5.x. This keeps the old tap
  # current for one more release, so tap users get 0.7.1's fix. Goes in 0.7.2.
  homebrew:
    needs: release
    # Skip homebrew formula update for pre-release tags (e.g. v0.2.0-rc.1).
    # Brew has no pre-release concept, so any formula push reaches every
    # `brew upgrade` user.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute sha256 for each release asset
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          for asset in \
            diskwatch-macos-x86_64.tar.gz \
            diskwatch-macos-aarch64.tar.gz \
            diskwatch-linux-x86_64-static.tar.gz \
            diskwatch-linux-aarch64-static.tar.gz
          do
            url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${asset}"
            for i in 1 2 3 4 5; do
              if curl -sLf "${url}" -o "${asset}"; then break; fi
              echo "Download ${asset} attempt $i failed, retrying..."; sleep 5
            done
            test -s "${asset}" || { echo "Failed to download ${asset}"; exit 1; }
            hash=$(sha256sum "${asset}" | awk '{print $1}')
            key=$(echo "${asset}" | sed -E 's/diskwatch-//; s/\.tar\.gz$//; s/-/_/g')
            echo "sha_${key}=${hash}" >> $GITHUB_OUTPUT
          done

      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matthart1983/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate Formula
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA_MACOS_X86_64: ${{ steps.sha.outputs.sha_macos_x86_64 }}
          SHA_MACOS_AARCH64: ${{ steps.sha.outputs.sha_macos_aarch64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.sha_linux_x86_64_static }}
          SHA_LINUX_AARCH64: ${{ steps.sha.outputs.sha_linux_aarch64_static }}
        run: |
          cat > homebrew-tap/Formula/diskwatch.rb <<EOF
          class Diskwatch < Formula
            desc "Single-host disk diagnostics TUI — sibling to netwatch and syswatch"
            homepage "https://github.com/matthart1983/diskwatch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/matthart1983/diskwatch/releases/download/v${VERSION}/diskwatch-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_AARCH64}"

                def install
                  bin.install "diskwatch-macos-aarch64" => "diskwatch"
                end
              end
              on_intel do
                url "https://github.com/matthart1983/diskwatch/releases/download/v${VERSION}/diskwatch-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_X86_64}"

                def install
                  bin.install "diskwatch-macos-x86_64" => "diskwatch"
                end
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/matthart1983/diskwatch/releases/download/v${VERSION}/diskwatch-linux-aarch64-static.tar.gz"
                sha256 "${SHA_LINUX_AARCH64}"

                def install
                  bin.install "diskwatch-linux-aarch64-static" => "diskwatch"
                end
              end
              on_intel do
                url "https://github.com/matthart1983/diskwatch/releases/download/v${VERSION}/diskwatch-linux-x86_64-static.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"

                def install
                  bin.install "diskwatch-linux-x86_64-static" => "diskwatch"
                end
              end
            end

            test do
              assert_match "diskwatch", shell_output("#{bin}/diskwatch --help 2>&1", 1)
            end
          end
          EOF

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then diff against HEAD. `git diff` (unstaged)
          # ignores untracked files, so a brand-new formula would
          # falsely report "no change" on the first release.
          git add Formula/diskwatch.rb
          if git diff --cached --quiet -- Formula/diskwatch.rb; then
            echo "Formula already up to date"; exit 0
          fi
          git commit -m "diskwatch ${{ steps.sha.outputs.version }}: auto-update formula"
          git push origin main
