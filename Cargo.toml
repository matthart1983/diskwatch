[package]
name = "diskwatch"
version = "0.7.1"
edition = "2021"
rust-version = "1.95"
description = "Single-host, read-only disk diagnostics TUI. Eight tabs across devices, volumes, filesystems, IO, SMART, hot files, and insights. Sibling to netwatch and syswatch."
license = "MIT"
repository = "https://github.com/matthart1983/diskwatch"
homepage = "https://github.com/matthart1983/diskwatch"
readme = "README.md"
keywords = ["disk", "storage", "tui", "diagnostics", "observability"]
categories = ["command-line-utilities"]
exclude = [
    # Demo assets aren't needed by anyone consuming the crate.
    "demo.gif",
    "demo.tape",
    "demo-dense.gif",
    "demo-dense.tape",
]

[[bin]]
name = "diskwatch"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.32"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FSEvents-backed file watcher on macOS (kFSEventStreamCreateFlagFileEvents
# is enabled by default in notify 6+), inotify on Linux. We use the raw
# event stream, not the debounced API.
notify = "7"
libc = "0.2"
# Column clamping in the Lite view has to be display-width aware, not
# byte- or char-aware: a CJK filename shears every column to its right.
unicode-width = "0.2"

# The static Linux builds only. Under a Hot Files event flood their musl
# allocator kept what it freed: v0.7.1 reached 912 MB and was still growing a
# minute after the writes stopped. With mimalloc the same run peaks at 37 to
# 61 MB and falls back to about 20 MB. `no_thp` stops mimalloc asking Linux
# for transparent huge pages, which cost about 50 MB at idle. glibc holds up
# on its own, so unlike netwatch this isn't the allocator everywhere.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
